  32313865643538626638623234646431613361636266313935356564396164303264

# Swap for memory spikes. Changing it later needs a manual `swapoff`
# and removing `/swapfile`, because Ansible creates the file only once.
swap_size: 2G

# Internal web API, which GitHub Actions calls after publishing a new image
api_user: api
api_domain: api.cloud.hplush.dev
api_port: 8000
# Hardened Node.js image from Red Hat (Project Hummingbird). The tag is
# a rolling major version, updated automatically by podman-auto-update.
api_node_image: registry.access.redhat.com/hi/nodejs:26
# GitHub Actions must ask for an OIDC token with exactly this audience
api_audience: https://api.cloud.hplush.dev

# Self-hosted Plausible Analytics. The domain has no words like `analytics`
# or `stats`, which some ad-blocker lists match in hostnames.
analytics_user: plausible
analytics_domain: lens.hplush.dev
analytics_port: 8070
# All three tags are rolling, updated automatically by podman-auto-update.
# PostgreSQL and ClickHouse follow the Docker Compose file of Plausible
# (github.com/plausible/community-edition): check it before changing them.
analytics_image: ghcr.io/plausible/community-edition:v3
analytics_postgres_image: docker.io/library/postgres:16-alpine
analytics_clickhouse_image: docker.io/clickhouse/clickhouse-server:24.12-alpine

# Grafana with charts and alerts of Slow Reader production
dashboards_user: grafana
dashboards_domain: dashboard.hplush.dev
dashboards_port: 8090
dashboards_image: docker.io/grafana/grafana:latest
dashboards_admin: ai
