name: Lint
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # ansible-core supports a new Python only some time after its
          # release, so `3.x` breaks CI with every new Python
          python-version: '3.14'
      - name: Install the linter with Ansible
        run: pip install -r requirements.txt
      - name: Install the collections used by the playbook
        run: ansible-galaxy collection install -r requirements.yml
      - name: Create a fake Ansible Vault password
        run: echo lint > .vault-pass
      - name: Lint
        run: ansible-lint
