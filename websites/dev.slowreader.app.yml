---
# Staging of Slow Reader: two apps of the same image, which share one user
# and one private network with PostgreSQL.
user: slowreader

repository: hplush/slowreader
branch: main

# Only the containers of this website can reach the database: they share
# a private network, and the database publishes no port to the host.
database:
  image: docker.io/library/postgres:18
  name: slowreader

apps:
  # Web client and server to sync the data between the devices of a user.
  # nginx inside the image serves the assets and passes other requests
  # to the server.
  - name: slowreader-app
    domain: dev.slowreader.app
    # Clients of old builds connect to the old domain of the server
    aliases:
      - server.dev.slowreader.app
    image: ghcr.io/hplush/slowreader:dev
    # Every app has its own workflow, and only that workflow can deploy it
    workflow: main.yml
    # Chainguard’s nginx keeps its temporary files here and not in /tmp
    writable:
      - /var/lib/nginx/tmp
    container_port: 2553
    ports:
      blue: 8041
      green: 8042
    # Adds `DATABASE_URL` and puts the container into the private network
    database: true
    # `/health` asks the database, so the deploy waits for a working
    # connection before it switches the domain to the new container
    health_path: /health
    env:
      ROLE: app
      STAGING: '1'
      BEHIND_BALANCER: '1'
      # Passkeys and CORS work only for the web client on this origin
      WEB_ORIGIN: https://dev.slowreader.app

  # CORS proxy, which the web client uses to load RSS feeds. It has its own
  # domain, so proxied content can’t access the app’s storage, and the server
  # can’t link feed URLs to the user’s account.
  - name: slowreader-proxy
    domain: proxy.dev.slowreader.app
    image: ghcr.io/hplush/slowreader:dev
    workflow: main.yml
    container_port: 2553
    ports:
      blue: 8043
      green: 8044
    health_path: /health
    env:
      ROLE: proxy
      BEHIND_BALANCER: '1'
      PROXY_ORIGIN: ^https:\/\/dev\.slowreader\.app$
