---
user: browserslist

image: ghcr.io/browserslist/browsersl.ist:latest
repository: browserslist/browsersl.ist
workflow: ci.yml
branch: main

container_port: 8080
ports:
  blue: 8021
  green: 8022
health_path: /health
# The image is OCI, so Podman ignores its own `HEALTHCHECK`.
# We repeat the check from the Dockerfile here.
health_cmd: /bin/httpcheck http://localhost:8080/health
