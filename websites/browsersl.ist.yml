---
user: browserslist

image: ghcr.io/browserslist/browsersl.ist:latest
repository: browserslist/browsersl.ist
workflow: ci.yml
branch: main

container_port: 8080
ports:
  blue: 8021
  green: 8022
health_path: /health
# The image is OCI, so Podman ignores its own `HEALTHCHECK`.
# We repeat the check from the Dockerfile here.
# Podman runs a string through /bin/sh, which the image does not have
health_cmd: '["/bin/httpcheck", "http://127.0.0.1:8080/health"]'
