---
# The official repository allows unattended-upgrades to update Caddy
- name: Add the Caddy repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: deb
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: any-version
    components: main
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key
    state: present
    enabled: true
  register: caddy_repository

# Ubuntu Pro pins its own packages to 510, above the 500 of every normal
# repository, and its Caddy is years behind. Without this file `apt` keeps
# installing the Ubuntu version and ignores the one we added above.
- name: Prefer Caddy from the official repository
  ansible.builtin.copy:
    content: |
      # Managed by Ansible
      Package: caddy
      Pin: origin dl.cloudsmith.io
      Pin-Priority: 600
    dest: /etc/apt/preferences.d/caddy
    owner: root
    group: root
    mode: '0644'

# `latest` and not `present`: the pin only changes which version `apt`
# picks for a new install, and the server can already have an old one.
# The configs below use the syntax of the current Caddy, so the upgrade
# has to happen in the same run and not with the next nightly upgrade.
- name: Install Caddy # noqa: package-latest
  ansible.builtin.apt:
    name: caddy
    state: latest
    update_cache: '{{ caddy_repository.changed }}'

# The default admin API listens on `127.0.0.1:2019` and can replace
# the whole config. `RuntimeDirectory` gives Caddy a private place
# for the socket we use instead.
- name: Give Caddy a private directory for the admin socket
  ansible.builtin.file:
    path: /etc/systemd/system/caddy.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Move the admin socket out of the shared loopback interface
  ansible.builtin.copy:
    src: 10-runtime-dir.conf
    dest: /etc/systemd/system/caddy.service.d/10-runtime-dir.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Caddy

- name: Create the directories for service configs
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    # Domain configs, which only Ansible changes
    - /etc/caddy/sites
    # Current container port of every website. A website user rewrites
    # its own file during the deploy.
    - /etc/caddy/upstreams
    # The page for visitors when the container behind the domain is down
    - /etc/caddy/errors

- name: Keep the site directory non-empty for the config glob
  ansible.builtin.copy:
    src: 00-placeholder.caddy
    dest: /etc/caddy/sites/00-placeholder.caddy
    owner: root
    group: root
    mode: '0644'
  notify: Reload Caddy

# A container which does not answer leaves Caddy with a 502 and an empty
# body, so every website shows this page instead.
- name: Add the page for a website which is down
  ansible.builtin.copy:
    src: down.html
    dest: /etc/caddy/errors/down.html
    owner: root
    group: root
    mode: '0644'
  notify: Reload Caddy

- name: Configure Caddy
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: '0644'
  notify: Reload Caddy

# The deploy script switches the domain to the new container and asks
# Caddy to pick up the change.
- name: Allow website users to reload Caddy
  ansible.builtin.copy:
    src: caddy-reload
    dest: /etc/sudoers.d/caddy-reload
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo --check --file %s

- name: Start Caddy
  ansible.builtin.systemd_service:
    name: caddy.service
    enabled: true
    state: started
